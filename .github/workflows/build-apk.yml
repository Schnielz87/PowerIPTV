name: APK bauen & veroeffentlichen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Schluessel aus Secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Eigener Signatur-Schluessel wird verwendet."
          else
            echo "Kein Signatur-Secret gesetzt – APK wird mit Debug-Schluessel signiert."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PowerIPTV-v1.1.${BUILD_NUMBER}.apk"
          # Fester Dateiname -> gleichbleibender Link .../releases/latest/download/PowerIPTV.apk (z.B. fuer Fire TV "Downloader")
          cp app/build/outputs/apk/release/app-release.apk "out/PowerIPTV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerIPTV-APK
          path: out/*.apk

      # Jede erfolgreiche Version erscheint unter "Releases" – dort einfach die APK antippen.
      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PowerIPTV v1.1.${{ github.run_number }} (neueste Version)
          make_latest: "true"
          files: out/*.apk
          body: |
            **Portiva – PowerIPTV** · Build ${{ github.run_number }}

            📲 **Handy/Tablet:** Unten bei *Assets* auf `PowerIPTV-v1.1.${{ github.run_number }}.apk` tippen,
            herunterladen und installieren („Installation aus unbekannten Quellen“ erlauben).

            📺 **Fire TV / Android TV:** Dieselbe APK – die App erkennt den Fernseher automatisch.
            (`PowerIPTV.apk` ist identisch, nur mit festem Dateinamen fuer einen gleichbleibenden Download-Link.)

            Commit: ${{ github.sha }}
