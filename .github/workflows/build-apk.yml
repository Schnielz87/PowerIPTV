name: APK bauen

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen (Debug + Release)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/PowerIPTV-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/PowerIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PowerIPTV-APK
          path: out/*.apk
