name: APK + Windows bauen & veroeffentlichen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Schluessel aus Secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Eigener Signatur-Schluessel wird verwendet."
          else
            echo "Kein Signatur-Secret gesetzt – APK wird mit Debug-Schluessel signiert."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PowerIPTV-v1.1.${BUILD_NUMBER}.apk"
          # Fester Dateiname -> gleichbleibender Link .../releases/latest/download/PowerIPTV.apk (z.B. fuer Fire TV "Downloader")
          cp app/build/outputs/apk/release/app-release.apk "out/PowerIPTV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerIPTV-APK
          path: out/*.apk

  # Windows-App (Ordner Windows/): Installer (.exe/.msi) + portable ZIP, VLC wird mitgeliefert
  windows:
    runs-on: windows-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: VLC (libVLC) fuer den Player laden
        shell: pwsh
        run: |
          $v = "3.0.21"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip" -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlctmp
          $src = "vlctmp/vlc-$v"
          $dst = "Windows/build/vlc-resources/windows/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src/libvlc.dll", "$src/libvlccore.dll" $dst
          Copy-Item "$src/plugins" $dst -Recurse
          # Nicht benoetigt: VLC-eigene Oberflaechen, Skripte, Visualisierungen
          foreach ($d in "gui", "lua", "visualization", "control") { Remove-Item "$dst/plugins/$d" -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem $dst | Format-Table Name

      - name: Windows-App bauen
        shell: pwsh
        run: ./gradlew.bat -p Windows --no-daemon createDistributable packageExe packageMsi

      - name: Dateien zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $b = "Windows/build/compose/binaries/main"
          Copy-Item (Get-ChildItem "$b/exe/*.exe")[0].FullName "out/Portiva-Windows-Setup-v1.1.$env:BUILD_NUMBER.exe"
          Copy-Item (Get-ChildItem "$b/msi/*.msi")[0].FullName "out/Portiva-Windows-v1.1.$env:BUILD_NUMBER.msi"
          # Fester Name -> gleichbleibender Link .../releases/latest/download/Portiva-Windows-Setup.exe
          Copy-Item "out/Portiva-Windows-Setup-v1.1.$env:BUILD_NUMBER.exe" "out/Portiva-Windows-Setup.exe"
          Compress-Archive -Path "$b/app/Portiva" -DestinationPath "out/Portiva-Windows-Portable-v1.1.$env:BUILD_NUMBER.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Portiva-Windows
          path: out/*

  release:
    needs: [build, windows]
    # Die APK erscheint auch dann, wenn der Windows-Build einmal fehlschlaegt
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PowerIPTV-APK
          path: out

      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: Portiva-Windows
          path: out

      # Jede erfolgreiche Version erscheint unter "Releases" – dort einfach die passende Datei antippen.
      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PowerIPTV v1.1.${{ github.run_number }} (neueste Version)
          make_latest: "true"
          files: out/*
          body: |
            **Portiva – PowerIPTV** · Build ${{ github.run_number }}

            📲 **Handy/Tablet:** Unten bei *Assets* auf `PowerIPTV-v1.1.${{ github.run_number }}.apk` tippen,
            herunterladen und installieren („Installation aus unbekannten Quellen“ erlauben).

            📺 **Fire TV / Android TV:** Dieselbe APK – die App erkennt den Fernseher automatisch.
            (`PowerIPTV.apk` ist identisch, nur mit festem Dateinamen fuer einen gleichbleibenden Download-Link.)

            💻 **Windows-PC:** `Portiva-Windows-Setup-v1.1.${{ github.run_number }}.exe` herunterladen und ausfuehren
            (bei der Windows-Warnung „Weitere Informationen“ → „Trotzdem ausfuehren“). VLC ist bereits enthalten.
            Ohne Installation: `Portiva-Windows-Portable-…zip` entpacken und `Portiva.exe` starten.

            Commit: ${{ github.sha }}
