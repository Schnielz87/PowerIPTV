name: APK + Windows + Samsung TV + iOS bauen & veroeffentlichen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Schluessel aus Secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Eigener Signatur-Schluessel wird verwendet."
          else
            echo "Kein Signatur-Secret gesetzt – APK wird mit Debug-Schluessel signiert."
          fi

      - name: APK bauen (Ordner Android/)
        working-directory: Android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp Android/app/build/outputs/apk/release/app-release.apk "out/PowerIPTV-v1.1.${BUILD_NUMBER}.apk"
          # Fester Dateiname -> gleichbleibender Link .../releases/latest/download/PowerIPTV.apk (z.B. fuer Fire TV "Downloader")
          cp Android/app/build/outputs/apk/release/app-release.apk "out/PowerIPTV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerIPTV-APK
          path: out/*.apk

  # Windows-App (Ordner Windows/): Installer (.exe/.msi) + portable ZIP, VLC wird mitgeliefert
  windows:
    runs-on: windows-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: VLC (libVLC) fuer den Player laden
        shell: pwsh
        run: |
          $v = "3.0.21"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip" -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlctmp
          $src = "vlctmp/vlc-$v"
          $dst = "Windows/build/vlc-resources/windows/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src/libvlc.dll", "$src/libvlccore.dll" $dst
          Copy-Item "$src/plugins" $dst -Recurse
          # Nicht benoetigt: VLC-eigene Oberflaechen, Skripte, Visualisierungen
          foreach ($d in "gui", "lua", "visualization", "control") { Remove-Item "$dst/plugins/$d" -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem $dst | Format-Table Name

      - name: Windows-App bauen
        shell: pwsh
        working-directory: Windows
        run: ./gradlew.bat --no-daemon createDistributable packageExe packageMsi

      - name: Dateien zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $b = "Windows/build/compose/binaries/main"
          Copy-Item (Get-ChildItem "$b/exe/*.exe")[0].FullName "out/Portiva-Windows-Setup-v1.1.$env:BUILD_NUMBER.exe"
          Copy-Item (Get-ChildItem "$b/msi/*.msi")[0].FullName "out/Portiva-Windows-v1.1.$env:BUILD_NUMBER.msi"
          # Fester Name -> gleichbleibender Link .../releases/latest/download/Portiva-Windows-Setup.exe
          Copy-Item "out/Portiva-Windows-Setup-v1.1.$env:BUILD_NUMBER.exe" "out/Portiva-Windows-Setup.exe"
          Compress-Archive -Path "$b/app/Portiva" -DestinationPath "out/Portiva-Windows-Portable-v1.1.$env:BUILD_NUMBER.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Portiva-Windows
          path: out/*

  # Samsung Smart TV (Ordner "Tizen Samsung/"): Web-App fuer Tizen 4.0+ (Chromium M56)
  tizen:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: Tizen Samsung
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tizen-App bauen (JS/CSS fuer Chromium 56)
        run: |
          npm ci
          node build.js

      - name: Unsigniertes Paket (zum Signieren mit dem eigenen Samsung-Zertifikat)
        run: |
          mkdir -p ../out
          rm -rf PowerIPTV-Tizen && cp -r build PowerIPTV-Tizen
          zip -qr "../out/PowerIPTV-Tizen-v1.1.${BUILD_NUMBER}.zip" PowerIPTV-Tizen

      # Optional: fertig signierte PowerIPTV.wgt, wenn die Samsung-Zertifikate als Secrets hinterlegt sind
      # (TIZEN_AUTHOR_P12_BASE64, TIZEN_AUTHOR_PASSWORD, TIZEN_DISTRIBUTOR_P12_BASE64, TIZEN_DISTRIBUTOR_PASSWORD).
      # Das Zertifikat ist an die DUID des eigenen Fernsehers gebunden – es wird nie ins Repository eingecheckt.
      - name: PowerIPTV.wgt signieren (optional)
        continue-on-error: true
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PW: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DIST_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DIST_PW: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          if [ -z "$AUTHOR_P12" ] || [ -z "$DIST_P12" ]; then
            echo "Keine Tizen-Zertifikate als Secrets – nur das unsignierte ZIP wird veroeffentlicht."
            exit 0
          fi
          echo "$AUTHOR_P12" | base64 -d > "$RUNNER_TEMP/author.p12"
          echo "$DIST_P12" | base64 -d > "$RUNNER_TEMP/distributor.p12"
          wget -q https://download.tizen.org/sdk/Installer/tizen-studio_6.0/web-cli_Tizen_Studio_6.0_ubuntu-64.bin -O "$RUNNER_TEMP/tizen.bin"
          chmod +x "$RUNNER_TEMP/tizen.bin"
          "$RUNNER_TEMP/tizen.bin" --accept-license "$HOME/tizen-studio"
          T="$HOME/tizen-studio/tools/ide/bin/tizen"
          "$T" security-profiles add -n PortivaTV -a "$RUNNER_TEMP/author.p12" -p "$AUTHOR_PW" -d "$RUNNER_TEMP/distributor.p12" -dp "$DIST_PW"
          "$T" package -t wgt -s PortivaTV -- "$PWD/build"
          W=$(ls build/*.wgt | head -1)
          cp "$W" "../out/PowerIPTV-Tizen-v1.1.${BUILD_NUMBER}.wgt"
          cp "$W" "../out/PowerIPTV.wgt"
          rm -f "$RUNNER_TEMP/author.p12" "$RUNNER_TEMP/distributor.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Portiva-Tizen
          path: out/*

  # iPhone/iPad (Ordner iOS/): SwiftUI + VLC (MobileVLCKit), unsignierte .ipa zum Aufspielen mit Sideloadly/AltStore
  ios:
    runs-on: macos-14
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: iOS
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Projekt erzeugen + VLC (MobileVLCKit) laden
        run: |
          xcodegen generate
          pod install --repo-update

      - name: iOS-App bauen (unsigniert)
        run: |
          xcodebuild -workspace Portiva.xcworkspace -scheme Portiva -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            BUILD_NUMBER=$BUILD_NUMBER CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 200; exit ${PIPESTATUS[0]}

      - name: .ipa erstellen
        run: |
          mkdir -p Payload ../out
          cp -R build/Build/Products/Release-iphoneos/Portiva.app Payload/
          zip -qry "../out/Portiva-iOS-v1.1.${BUILD_NUMBER}.ipa" Payload
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: Portiva-iOS
          path: out/*

  release:
    needs: [build, windows, tizen, ios]
    # Die APK erscheint auch dann, wenn der Windows-Build einmal fehlschlaegt
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PowerIPTV-APK
          path: out

      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: Portiva-Windows
          path: out

      - uses: actions/download-artifact@v4
        if: ${{ needs.tizen.result == 'success' }}
        with:
          name: Portiva-Tizen
          path: out

      - uses: actions/download-artifact@v4
        if: ${{ needs.ios.result == 'success' }}
        with:
          name: Portiva-iOS
          path: out

      # Jede erfolgreiche Version erscheint unter "Releases" – dort einfach die passende Datei antippen.
      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PowerIPTV v1.1.${{ github.run_number }} (neueste Version)
          make_latest: "true"
          files: out/*
          body: |
            **Portiva – PowerIPTV** · Build ${{ github.run_number }}

            📲 **Handy/Tablet:** Unten bei *Assets* auf `PowerIPTV-v1.1.${{ github.run_number }}.apk` tippen,
            herunterladen und installieren („Installation aus unbekannten Quellen“ erlauben).

            📺 **Fire TV / Android TV:** Dieselbe APK – die App erkennt den Fernseher automatisch.
            (`PowerIPTV.apk` ist identisch, nur mit festem Dateinamen fuer einen gleichbleibenden Download-Link.)

            💻 **Windows-PC:** `Portiva-Windows-Setup-v1.1.${{ github.run_number }}.exe` herunterladen und ausfuehren
            (bei der Windows-Warnung „Weitere Informationen“ → „Trotzdem ausfuehren“). VLC ist bereits enthalten.
            Ohne Installation: `Portiva-Windows-Portable-…zip` entpacken und `Portiva.exe` starten.

            📺 **Samsung Smart TV (Tizen, z.B. UE49NU8009):** `PowerIPTV-Tizen-v1.1.${{ github.run_number }}.zip` am PC entpacken,
            mit dem eigenen Samsung-Zertifikat signieren und per Entwicklermodus installieren
            (`tizen package -t wgt -s PortivaTV -- PowerIPTV-Tizen` → `tizen install -n Portiva.wgt -t <TV>`).
            Genaue Schritte: Bedienungsanleitung, Kapitel „Samsung Smart TV“.

            📱 **iPhone/iPad:** `Portiva-iOS-v1.1.${{ github.run_number }}.ipa` am PC/Mac mit Sideloadly (oder AltStore) und deiner Apple-ID aufspielen.
            Genaue Schritte: Bedienungsanleitung, Kapitel „iPhone & iPad“.

            Commit: ${{ github.sha }}
