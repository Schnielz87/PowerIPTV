org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Ressourcen-Pfade im APK nicht kuerzen (res/mipmap-xhdpi/... statt res/9n.png): die Fire-TV-Startseite
# liest bei Apps ausserhalb des Amazon-Appstores das Symbol selbst aus dem APK und zeigt sonst teils kein Logo
android.enableResourceOptimizations=false
